<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A slowly rotating eight-spoked wheel of aged gray sand, above a gently wind-swept interactive desert dune." />
  <title>Sand Wheel · Desert Motion</title>
  <link rel="preload" href="sand-wheel.png" as="image" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene" aria-label="A dark sand sculpture: an eight-spoked wheel rotating gently over a bed of interactive gray desert sand">
    <div class="wheel-position" aria-hidden="true">
      <div id="wheel" class="wheel">
        <img src="sand-wheel.png"
          alt="The exact eight-handled, eight-spoked aged-silver wheel reconstructed with dark, medium, and pale-gray grains of sand"
          draggable="false" width="1044" height="1044" />
      </div>
    </div>
    <canvas id="sand" aria-label="Gray desert sand dune. Move a mouse or finger over its surface to scatter grains gently." role="img"></canvas>
  </main>
</body>
</html>
